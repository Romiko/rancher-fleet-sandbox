defaultNamespace: grafana
helm:
  releaseName: grafana
  chart: grafana
  repo: https://grafana.github.io/helm-charts
  version: 8.14.0
  valuesFiles:
    - values.yaml

targetCustomizations:
- name: dev
  clusterSelector:
    matchLabels:
      env: dev
  helm:
    values:
      persistence:
        enabled: false
      service:
        type: LoadBalancer
      adminPassword: "admin123"
