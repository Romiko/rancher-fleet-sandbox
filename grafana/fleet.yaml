defaultNamespace: grafana
helm:
  releaseName: grafana
  chart: grafana
  repo: https://grafana.github.io/helm-charts
  version: 8.14.0
  valuesFiles:
    - values.yaml

targetCustomizations:
- name: dev
  clusterSelector:
    matchLabels:
      env: dev
  helm:
    values:
      service:
        type: NodePort
        port: 80
        targetPort: 3000
        nodePort: 32000
      adminPassword: "admin123"
