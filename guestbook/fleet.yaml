defaultNamespace: guestbook
helm:
  chart: ./chart
  releaseName: guestbook
  valuesFiles:
    - chart/values.yaml
targetCustomizations:
- name: dev
  clusterSelector:
    matchLabels:
      env: dev
  helm:
    values:
      replicaCount: 1
- name: prod
  clusterSelector:
    matchLabels:
      env: prod
  helm:
    values:
      replicaCount: 3
