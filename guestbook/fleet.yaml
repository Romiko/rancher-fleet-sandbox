defaultNamespace: guestbook
helm:
  chart: ./chart
  releaseName: guestbook

targetCustomizations:
- name: dev
  clusterSelector:
    matchLabels:
      env: dev
  helm:
    valuesFiles:
      - chart/values-dev.yaml
- name: prod
  clusterSelector:
    matchLabels:
      env: prod
  helm:
    valuesFiles:
      - chart/values-prod.yaml
